
name: WorkLog CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# CI はチェックアウトとビルド・テストのみを行うため、
# contents の読み取り権限だけで十分
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # PostgreSQL の起動待ち・復元・ビルド・テストを含めた実用上の上限。
    # ハングしたジョブを放置しないために設定する。
    timeout-minutes: 15

    # PostgreSQL の設定は compose.yaml に集約する。
    # ここで定義した値を compose.yaml と接続文字列の両方に渡すため、
    # 二重定義による不整合が起こらない。
    env:
      WORKLOG_TEST_DB: worklog_test
      WORKLOG_TEST_USER: worklog_user
      WORKLOG_TEST_PORT: '5435'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # compose.yaml は WORKLOG_TEST_PASSWORD を必須にしている。
      # テスト用 DB の使い捨ての値をリポジトリにコミットしないよう、
      # 実行のたびにランダム生成して渡す。値はランナーと共に破棄される。
      - name: Generate test database password
        run: echo "WORKLOG_TEST_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      # ローカルと同じ compose.yaml を使う。--wait は healthcheck が
      # healthy になるまで待機するため、接続待ちの処理は不要。
      - name: Start PostgreSQL from compose.yaml
        run: docker compose up -d --wait postgres-test

      # compose.yaml と同じ env の値から接続文字列を組み立てる。
      - name: Build test connection string
        run: |
          echo "WORKLOG_TEST_CONNECTION_STRING=Host=localhost;Port=$WORKLOG_TEST_PORT;Database=$WORKLOG_TEST_DB;Username=$WORKLOG_TEST_USER;Password=$WORKLOG_TEST_PASSWORD" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: |
          dotnet restore WorkLog.Api/WorkLog.Api.csproj
          dotnet restore tests/WorkLog.Domain.Tests/
          dotnet restore tests/WorkLog.Infrastructure.Tests/

      # テストプロジェクトは WorkLog.Api を参照しないため、明示的にビルドして
      # API 層のコンパイル破綻を CI で検出する
      - name: Build API
        run: dotnet build WorkLog.Api/WorkLog.Api.csproj --no-restore -c Release

      # coverlet.collector が参照されているだけでは動作しないため、
      # --collect で明示的に XPlat Code Coverage を有効にする。
      - name: Run Domain tests
        run: >-
          dotnet test tests/WorkLog.Domain.Tests/ --no-restore
          --results-directory TestResults
          --logger "trx;LogFileName=domain.trx"
          --collect:"XPlat Code Coverage"

      - name: Run Infrastructure tests
        run: >-
          dotnet test tests/WorkLog.Infrastructure.Tests/ --no-restore
          --results-directory TestResults
          --logger "trx;LogFileName=infrastructure.trx"
          --collect:"XPlat Code Coverage"

      # テストが失敗しても解析に必要なので、キャンセル時以外アップロードする
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: error

      # Cobertura 形式のため Codecov 等のツールにそのまま食わせられる。
      # データコレクタの作業用フォルダにも同名ファイルが生成されるため、
      # TestResults 直下の結果フォルダのみを対象にして重複を防ぐ。
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: TestResults/*/coverage.cobertura.xml
          if-no-files-found: error

      # compose 方式ではコンテナのログが自動では出ないため、失敗時のみ収集する
      - name: Dump PostgreSQL logs on failure
        if: failure()
        run: docker compose logs --no-color postgres-test
